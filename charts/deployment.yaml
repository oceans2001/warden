apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden-api
  template:
    metadata:
      labels:
        app: warden-api
    spec:
      serviceAccountName: warden-api
      containers:
        - name: warden-api
          image: warden-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: warden-api
  namespace: default
  labels:
    app: warden-api
spec:
  selector:
    app: warden-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080